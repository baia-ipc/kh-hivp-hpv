title: "Phylogenetic Tree - Report"

custom_data:
  methods_summary:
    plot_type: "html"
    section_name: "Methods summary"
    description: "Summary of phylogenetic tree construction"
    data: |
      <ul>
        <li><strong>Concatenate inputs:</strong> combine selected references, outgroups, lineage refs, and samples.</li>
        <li><strong>Alignment:</strong> MAFFT alignment of concatenated sequences.</li>
        <li><strong>Trimming:</strong> trim alignment using TrimAl.</li>
        <li><strong>Tree inference:</strong> IQ-TREE with model selection and bootstrap support.</li>
      </ul>
      <p><strong>References:</strong></p>
      <ul>
        <li>Katoh et al., 2002. MAFFT: a novel method for rapid multiple sequence alignment. <em>Nucleic Acids Research</em>. DOI: 10.1093/nar/gkf436.</li>
        <li>Capella-Gutiérrez et al., 2009. trimAl: a tool for automated alignment trimming. <em>Bioinformatics</em>. DOI: 10.1093/bioinformatics/btp348.</li>
        <li>Minh et al., 2020. IQ-TREE 2: New models and efficient methods for phylogenetic inference. <em>Molecular Biology and Evolution</em>. DOI: 10.1093/molbev/msaa015.</li>
      </ul>
  output_locations:
    plot_type: "html"
    section_name: "Output locations"
    description: "Default output paths (can be overridden with Nextflow params)"
    data: |
      <ul>
        <li><code>&lt;outdir&gt;/</code> for alignment and tree outputs (including <code>phylo_tree.svg</code> and <code>phylo_tree.png</code>)</li>
        <li><code>&lt;reports_dir&gt;/</code> for this MultiQC report</li>
      </ul>
  tree_preview:
    plot_type: "html"
    section_name: "Tree preview"
    description: "Offline preview of the inferred phylogeny"
    data: |
      <figure>
        <img src="phylo_tree.svg" alt="Phylogenetic tree" style="max-width: 100%; height: auto;">
        <figcaption>Circular layout rendered from the IQ-TREE Newick output. Original files are saved under <code>&lt;outdir&gt;/</code>; the SVG is embedded in this report for offline viewing.</figcaption>
      </figure>
  tree_summary_table:
    file_format: "tsv"
    section_name: "Tree summary"
    description: "Alignment and IQ-TREE summary statistics"
    plot_type: "table"
    pconfig:
      col1_header: "Metric"

sp:
  tree_summary_table:
    fn: "phylo_tree_summary.multiqc.tsv"

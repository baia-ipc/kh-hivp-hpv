title: "Recombination GENECONV - Report"

custom_data:
  methods_summary:
    plot_type: "html"
    section_name: "Methods summary"
    description: "Stage-07 GENECONV candidate scanning"
    data: |
      <ul>
        <li><strong>Input:</strong> published stage-06 recombination screen artifacts.</li>
        <li><strong>Candidate scan:</strong> standalone GENECONV fragment scan.</li>
      </ul>
      <p><strong>Policy:</strong> this stage reports GENECONV candidate evidence only. It does not make final recombinant calls.</p>
  output_locations:
    plot_type: "html"
    section_name: "Output locations"
    description: "Primary output locations for this step"
    data: |
      <ul>
        <li><code>outs/targeted_analysis/07.recombination_geneconv/geneconv</code></li>
        <li><code>outs/targeted_analysis/07.recombination_geneconv/summary</code></li>
      </ul>
  reports_tables:
    plot_type: "html"
    section_name: "Report tables"
    description: "User-facing GENECONV tables generated by this workflow"
    data: |
      <ul>
        <li><strong>Type overview:</strong> scan status and candidate counts per HPV type.</li>
        <li><strong>Candidate samples:</strong> GENECONV candidate rows for sample sequences only.</li>
        <li><strong>Method status:</strong> one row per HPV type with GENECONV exit status and timeout state.</li>
      </ul>
  recombination_geneconv_type_overview:
    file_format: "tsv"
    section_name: "Type Overview"
    description: "GENECONV status and candidate counts per HPV type."
    plot_type: "table"
    pconfig:
      col1_header: "Type"
  recombination_geneconv_candidate_samples:
    file_format: "tsv"
    section_name: "Candidate Samples"
    description: "GENECONV candidate rows for sample sequences before tree/read confirmation."
    plot_type: "table"
    pconfig:
      col1_header: "Candidate"
  recombination_geneconv_method_failures:
    file_format: "tsv"
    section_name: "Method Status"
    description: "GENECONV exit status for each HPV type."
    plot_type: "table"
    pconfig:
      col1_header: "Method"

sp:
  recombination_geneconv_type_overview:
    fn: "recombination_geneconv_type_overview.multiqc.tsv"
  recombination_geneconv_candidate_samples:
    fn: "recombination_geneconv_candidate_samples.multiqc.tsv"
  recombination_geneconv_method_failures:
    fn: "recombination_geneconv_method_failures.multiqc.tsv"

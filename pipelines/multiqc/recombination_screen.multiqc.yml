title: "Recombination Screen - Report"

custom_data:
  methods_summary:
    plot_type: "html"
    section_name: "Methods summary"
    description: "Stage-06 recombination screen"
    data: |
      <ul>
        <li><strong>Input preparation:</strong> metadata-driven sample selection, split by HPV type, with tree-selected same-type background references.</li>
        <li><strong>Alignment:</strong> MAFFT full alignment per HPV type.</li>
        <li><strong>Screening:</strong> optional pairwise identity visualization and HyPhy GARD breakpoint inference.</li>
      </ul>
      <p><strong>Policy:</strong> this stage reports input composition and alignment-level GARD signal only. It does not make sample-level recombinant calls.</p>
  output_locations:
    plot_type: "html"
    section_name: "Output locations"
    description: "Primary output locations for this step"
    data: |
      <ul>
        <li><code>outs/targeted_analysis/06.recombination_screen/alignment</code></li>
        <li><code>outs/targeted_analysis/06.recombination_screen/gard</code></li>
        <li><code>outs/targeted_analysis/06.recombination_screen/plots</code></li>
        <li><code>outs/targeted_analysis/06.recombination_screen/summary</code></li>
      </ul>
  reports_tables:
    plot_type: "html"
    section_name: "Report tables"
    description: "User-facing screening tables generated by this workflow"
    data: |
      <ul>
        <li><strong>Type overview:</strong> one row per HPV type with sample/background composition and GARD signal strength.</li>
        <li><strong>Input groups:</strong> per-type manifest, alignment, and representative-sequence audit.</li>
        <li><strong>Breakpoint support:</strong> GARD breakpoint positions and support classes.</li>
        <li><strong>Similarity plots:</strong> links to pairwise identity heatmap artifacts when enabled.</li>
        <li><strong>Duplicate map:</strong> exact-sequence collapsing applied before downstream confirmation.</li>
      </ul>
  recombination_screen_type_overview:
    file_format: "tsv"
    section_name: "Type Overview"
    description: "Per-type sample/background composition and GARD breakpoint summary."
    plot_type: "table"
    pconfig:
      col1_header: "Type"
  recombination_screen_input_groups:
    file_format: "tsv"
    section_name: "Input Groups"
    description: "Per-type manifest and alignment artifacts for the screen stage."
    plot_type: "table"
    pconfig:
      col1_header: "Type"
  recombination_screen_breakpoint_support:
    file_format: "tsv"
    section_name: "Breakpoint Support"
    description: "Alignment-level GARD breakpoint support per HPV type."
    plot_type: "table"
    pconfig:
      col1_header: "Breakpoint"
  recombination_screen_similarity_plots:
    file_format: "tsv"
    section_name: "Similarity Plots"
    description: "Pairwise identity plot artifact locations for each HPV type."
    plot_type: "table"
    pconfig:
      col1_header: "Type"
  recombination_screen_duplicate_map:
    file_format: "tsv"
    section_name: "Duplicate Map"
    description: "Exact-sequence duplicates collapsed before downstream sample-level analysis."
    plot_type: "table"
    pconfig:
      col1_header: "Duplicate"

sp:
  recombination_screen_type_overview:
    fn: "recombination_screen_type_overview.multiqc.tsv"
  recombination_screen_input_groups:
    fn: "recombination_screen_input_groups.multiqc.tsv"
  recombination_screen_breakpoint_support:
    fn: "recombination_screen_breakpoint_support.multiqc.tsv"
  recombination_screen_similarity_plots:
    fn: "recombination_screen_similarity_plots.multiqc.tsv"
  recombination_screen_duplicate_map:
    fn: "recombination_screen_duplicate_map.tsv"

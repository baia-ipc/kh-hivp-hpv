title: "Bowtie vs PAVE - Mapping Report"
skip_generalstats: true
exclude_modules:
  - bcftools
  - samtools

custom_data:
  methods_summary:
    plot_type: "html"
    section_name: "Methods summary"
    description: "Summary of mapping and reporting steps"
    data: |
      <ul>
        <li><strong>Bowtie2 mapping:</strong> map bucketed reads to PAVE reference and produce BAM/idxstats.</li>
        <li><strong>Coverage stats:</strong> compute depth and coverage metrics with <code>covstats.py</code>.</li>
        <li><strong>Aggregation:</strong> summarize top strains, coverage, and reporting tables in the reports directory.</li>
      </ul>
      <p><strong>References:</strong></p>
      <ul>
        <li>Langmead &amp; Salzberg, 2012. Fast gapped-read alignment with Bowtie 2. <em>Nature Methods</em>. DOI: 10.1038/nmeth.1923.</li>
        <li>Li et al., 2009. The Sequence Alignment/Map format and SAMtools. <em>Bioinformatics</em>. DOI: 10.1093/bioinformatics/btp352.</li>
      </ul>
  output_locations:
    plot_type: "html"
    section_name: "Output locations"
    description: "Default output paths (can be overridden with Nextflow params)"
    data: |
      <ul>
        <li><code>&lt;outdir&gt;/&lt;run_id&gt;/</code> for BAMs, idxstats, depth files, plots, and per-sample outputs</li>
        <li><code>&lt;reports_dir&gt;/</code> for aggregate tables and this MultiQC report</li>
        <li><code>&lt;bowtie_index_dir&gt;/</code> for the Bowtie2 index</li>
      </ul>
  reports_tables:
    plot_type: "html"
    section_name: "Reports tables"
    description: "Aggregate tables written to the reports directory"
    data: |
      <ul>
        <li><code>strains.tsv</code></li>
        <li><code>cov_stats.tsv</code></li>
        <li><code>cov_stats.filtered.tsv</code></li>
        <li><code>strain_assignment_coverage.tsv</code></li>
      </ul>
  strains_table:
    file_format: "tsv"
    section_name: "Top strains"
    description: "Aggregated top strain calls across samples"
    plot_type: "table"
    pconfig:
      col1_header: "Sample"
  cov_stats_table:
    file_format: "tsv"
    section_name: "Coverage stats"
    description: "Aggregated coverage statistics"
    plot_type: "table"
    pconfig:
      col1_header: "Sample"
  cov_stats_filtered_table:
    file_format: "tsv"
    section_name: "Coverage stats (filtered)"
    description: "Filtered coverage statistics"
    plot_type: "table"
    pconfig:
      col1_header: "Sample"
  strain_assignment_coverage_table:
    file_format: "tsv"
    section_name: "Strain assignment + coverage"
    description: "Top strains with averaged genome/E6/E7 coverage and patient metadata"
    plot_type: "table"
    pconfig:
      col1_header: "Sample"

sp:
  strains_table:
    fn: "strains.multiqc.tsv"
  cov_stats_table:
    fn: "cov_stats.multiqc.tsv"
  cov_stats_filtered_table:
    fn: "cov_stats.filtered.multiqc.tsv"
  strain_assignment_coverage_table:
    fn: "strain_assignment_coverage.multiqc.tsv"

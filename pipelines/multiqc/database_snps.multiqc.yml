title: "Database SNP comparison"
rename_regex: true
sample_names_rename:
  - ["^3__",""]
  - ["^2__",""]
  - ["^1__",""]

custom_data:
  methods_summary:
    plot_type: "html"
    section_name: "Methods summary"
    description: "Summary of database SNP extraction and comparison"
    data: |
      <ul>
        <li><strong>Sequence extraction:</strong> filter selected NCBI HPV16/HPV18 reference genomes by country and extract database accessions.</li>
        <li><strong>SNP calling:</strong> align each database genome to the PAVE reference with minimap2 and call SNPs with bcftools, limited to E6/E7 regions.</li>
        <li><strong>Comparisons:</strong> annotate database SNPs with lineage-defining SNPs and with SNPs observed in study samples.</li>
      </ul>
      <p><strong>References:</strong></p>
      <ul>
        <li>Li, 2018. Minimap2: pairwise alignment for nucleotide sequences. <em>Bioinformatics</em>. DOI: 10.1093/bioinformatics/bty191.</li>
        <li>Li, 2011. A statistical framework for SNP calling, mutation discovery, association mapping and population genetical parameter estimation from sequencing data. <em>Bioinformatics</em>. DOI: 10.1093/bioinformatics/btr509.</li>
      </ul>
  output_locations:
    plot_type: "html"
    section_name: "Output locations"
    description: "Default output paths (can be overridden with Nextflow params)"
    data: |
      <ul>
        <li><code>&lt;outdir&gt;/</code> for extracted database FASTA sequences</li>
        <li><code>&lt;reports_dir&gt;/</code> for SNP tables and this MultiQC report</li>
      </ul>
  reports_tables:
    plot_type: "html"
    section_name: "Reports tables"
    description: "Tables written to the reports directory"
    data: |
      <ul>
        <li><code>database_snps.tsv</code></li>
        <li><code>database_lineage_comparison.tsv</code></li>
        <li><code>database_sample_comparison.tsv</code></li>
        <li><code>samples_vs_database.tsv</code></li>
        <li><code>samples_vs_database_sets.tsv</code></li>
        <li><code>samples_vs_lineage_sets.tsv</code></li>
        <li><code>hpv16_e6e7_variants_summary.tsv</code></li>
      </ul>
  database_snps_table:
    file_format: "tsv"
    section_name: "Database SNPs"
    description: "E6/E7 SNPs called from database reference genomes"
    plot_type: "table"
    pconfig:
      col1_header: "ID"
  database_lineage_table:
    file_format: "tsv"
    section_name: "Database vs lineages"
    description: "Database SNPs annotated with lineage-defining SNPs"
    plot_type: "table"
    pconfig:
      col1_header: "ID"
  database_sample_table:
    file_format: "tsv"
    section_name: "Database vs samples"
    description: "Database SNPs annotated with sample SNP matches"
    plot_type: "table"
    pconfig:
      col1_header: "ID"
  samples_vs_database_table:
    file_format: "tsv"
    section_name: "Samples vs database"
    description: "Sample SNPs annotated with database SNP matches"
    plot_type: "table"
    pconfig:
      col1_header: "ID"
  samples_vs_database_sets_table:
    file_format: "tsv"
    section_name: "Samples vs database (set)"
    description: "Sample SNP sets compared against database SNP sets"
    plot_type: "table"
    pconfig:
      col1_header: "ID"
  samples_vs_lineage_sets_table:
    file_format: "tsv"
    section_name: "Samples vs lineages (set)"
    description: "Sample SNP sets compared against lineage SNP sets"
    plot_type: "table"
    pconfig:
      col1_header: "ID"
  hpv16_e6e7_summary_table:
    file_format: "tsv"
    section_name: "HPV16 E6/E7 variant summary"
    description: "Variant summaries for samples, database accessions, and lineages"
    plot_type: "table"
    pconfig:
      col1_header: "ID"

sp:
  database_snps_table:
    fn: "database_snps.multiqc.tsv"
  database_lineage_table:
    fn: "database_lineage_comparison.multiqc.tsv"
  database_sample_table:
    fn: "database_sample_comparison.multiqc.tsv"
  samples_vs_database_table:
    fn: "samples_vs_database.multiqc.tsv"
  samples_vs_database_sets_table:
    fn: "samples_vs_database_sets.multiqc.tsv"
  samples_vs_lineage_sets_table:
    fn: "samples_vs_lineage_sets.multiqc.tsv"
  hpv16_e6e7_summary_table:
    fn: "hpv16_e6e7_variants_summary.multiqc.tsv"

title: "Recombination Confirmation - Report"

custom_data:
  methods_summary:
    plot_type: "html"
    section_name: "Methods summary"
    description: "Stage-08 recombination confirmation workflow"
    data: |
      <ul>
        <li><strong>Inputs:</strong> published stage-07 OpenRDP artifacts plus upstream mapping and variant-analysis reports.</li>
        <li><strong>Confirmation:</strong> IQ-TREE breakpoint-window topology switching and mapped-read validation.</li>
        <li><strong>Final reporting:</strong> per-type summaries, aggregated tables, and final candidate recombinant calls.</li>
      </ul>
      <p><strong>Calling policy:</strong> a sample is only labeled <code>candidate_recombinant</code> when GARD, OpenRDP, IQ-TREE, and read validation agree.</p>
  output_locations:
    plot_type: "html"
    section_name: "Output locations"
    description: "Primary output locations for this step"
    data: |
      <ul>
        <li><code>outs/targeted_analysis/08.recombination_confirmation/trees</code></li>
        <li><code>outs/targeted_analysis/08.recombination_confirmation/read_validation</code></li>
        <li><code>outs/targeted_analysis/08.recombination_confirmation/summary</code></li>
      </ul>
  reports_tables:
    plot_type: "html"
    section_name: "Report tables"
    description: "User-facing final confirmation tables generated by this workflow"
    data: |
      <ul>
        <li><strong>Per-type overview:</strong> background composition and global GARD/OpenRDP/final-call summary.</li>
        <li><strong>Candidate samples:</strong> one row per sample with final status, corrected p-values, parents, tree support, and read validation.</li>
        <li><strong>Breakpoint support:</strong> per-breakpoint GARD statistics by HPV type.</li>
        <li><strong>Duplicate map:</strong> exact-sequence collapsing applied before sample-level inference.</li>
      </ul>
  recombination_type_overview:
    file_format: "tsv"
    section_name: "Type Overview"
    description: "One row per HPV type, summarizing background size, GARD evidence, OpenRDP candidates, and whether any sample passed the full confirmation stack."
    plot_type: "table"
    pconfig:
      col1_header: "Type"
  recombination_candidate_samples:
    file_format: "tsv"
    section_name: "Candidate Samples"
    description: "One row per analyzed sample with final status, candidate parents, corrected p-values, GARD support, IQ-TREE support, and read validation."
    plot_type: "table"
    pconfig:
      col1_header: "Sample"
  recombination_breakpoint_support:
    file_format: "tsv"
    section_name: "Breakpoint Support"
    description: "GARD breakpoint-level statistics for each HPV type. These are alignment-level model-selection metrics, not sample-level p-values."
    plot_type: "table"
    pconfig:
      col1_header: "Breakpoint"
  recombination_duplicate_map:
    file_format: "tsv"
    section_name: "Duplicate Map"
    description: "Exact-sequence duplicates collapsed before sample-level detection. This preserves transparency when samples or references are identical."
    plot_type: "table"
    pconfig:
      col1_header: "Representative"

sp:
  recombination_type_overview:
    fn: "recombination_type_overview.multiqc.tsv"
  recombination_candidate_samples:
    fn: "recombination_candidate_samples.multiqc.tsv"
  recombination_breakpoint_support:
    fn: "recombination_breakpoint_support.multiqc.tsv"
  recombination_duplicate_map:
    fn: "recombination_duplicate_map.tsv"

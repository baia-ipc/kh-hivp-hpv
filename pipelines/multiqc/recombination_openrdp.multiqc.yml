title: "Recombination OpenRDP - Report"

custom_data:
  methods_summary:
    plot_type: "html"
    section_name: "Methods summary"
    description: "Stage-07 OpenRDP candidate scanning"
    data: |
      <ul>
        <li><strong>Input:</strong> published stage-06 recombination screen artifacts.</li>
        <li><strong>Candidate scan:</strong> OpenRDP method ensemble with per-method fallback handling when one method crashes.</li>
      </ul>
      <p><strong>Policy:</strong> this stage reports OpenRDP candidate evidence only. It does not make final recombinant calls.</p>
  output_locations:
    plot_type: "html"
    section_name: "Output locations"
    description: "Primary output locations for this step"
    data: |
      <ul>
        <li><code>outs/targeted_analysis/07.recombination_openrdp/openrdp</code></li>
        <li><code>outs/targeted_analysis/07.recombination_openrdp/summary</code></li>
      </ul>
  reports_tables:
    plot_type: "html"
    section_name: "Report tables"
    description: "User-facing OpenRDP tables generated by this workflow"
    data: |
      <ul>
        <li><strong>Type overview:</strong> method status and candidate counts per HPV type.</li>
        <li><strong>Candidate samples:</strong> OpenRDP candidate rows for sample sequences only.</li>
        <li><strong>Method status:</strong> one row per requested OpenRDP method with exit status and candidate contribution.</li>
      </ul>
  recombination_openrdp_type_overview:
    file_format: "tsv"
    section_name: "Type Overview"
    description: "OpenRDP method status and candidate counts per HPV type."
    plot_type: "table"
    pconfig:
      col1_header: "Type"
  recombination_openrdp_candidate_samples:
    file_format: "tsv"
    section_name: "Candidate Samples"
    description: "OpenRDP candidate rows for sample sequences before tree/read confirmation."
    plot_type: "table"
    pconfig:
      col1_header: "Candidate"
  recombination_openrdp_method_failures:
    file_format: "tsv"
    section_name: "Method Status"
    description: "Exit status for each requested OpenRDP method by HPV type."
    plot_type: "table"
    pconfig:
      col1_header: "Method"

sp:
  recombination_openrdp_type_overview:
    fn: "recombination_openrdp_type_overview.multiqc.tsv"
  recombination_openrdp_candidate_samples:
    fn: "recombination_openrdp_candidate_samples.multiqc.tsv"
  recombination_openrdp_method_failures:
    fn: "recombination_openrdp_method_failures.multiqc.tsv"

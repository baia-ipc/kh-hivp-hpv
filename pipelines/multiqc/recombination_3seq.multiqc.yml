title: "Recombination 3SEQ - Report"

custom_data:
  methods_summary:
    plot_type: "html"
    section_name: "Methods summary"
    description: "Stage-07 3SEQ candidate scanning"
    data: |
      <ul>
        <li><strong>Input:</strong> published stage-06 recombination screen artifacts.</li>
        <li><strong>Candidate scan:</strong> standalone 3SEQ exact triplet scan.</li>
      </ul>
      <p><strong>Policy:</strong> this stage reports 3SEQ candidate evidence only. It does not make final recombinant calls.</p>
  output_locations:
    plot_type: "html"
    section_name: "Output locations"
    description: "Primary output locations for this step"
    data: |
      <ul>
        <li><code>outs/targeted_analysis/07.recombination_3seq/3seq</code></li>
        <li><code>outs/targeted_analysis/07.recombination_3seq/summary</code></li>
      </ul>
  reports_tables:
    plot_type: "html"
    section_name: "Report tables"
    description: "User-facing 3SEQ tables generated by this workflow"
    data: |
      <ul>
        <li><strong>Type overview:</strong> scan status and candidate counts per HPV type.</li>
        <li><strong>Candidate samples:</strong> 3SEQ candidate rows for sample sequences only.</li>
        <li><strong>Method status:</strong> one row per HPV type with 3SEQ exit status and timeout state.</li>
      </ul>
  recombination_3seq_type_overview:
    file_format: "tsv"
    section_name: "Type Overview"
    description: "3SEQ status and candidate counts per HPV type."
    plot_type: "table"
    pconfig:
      col1_header: "Type"
  recombination_3seq_candidate_samples:
    file_format: "tsv"
    section_name: "Candidate Samples"
    description: "3SEQ candidate rows for sample sequences before tree/read confirmation."
    plot_type: "table"
    pconfig:
      col1_header: "Candidate"
  recombination_3seq_method_failures:
    file_format: "tsv"
    section_name: "Method Status"
    description: "3SEQ exit status for each HPV type."
    plot_type: "table"
    pconfig:
      col1_header: "Method"

sp:
  recombination_3seq_type_overview:
    fn: "recombination_3seq_type_overview.multiqc.tsv"
  recombination_3seq_candidate_samples:
    fn: "recombination_3seq_candidate_samples.multiqc.tsv"
  recombination_3seq_method_failures:
    fn: "recombination_3seq_method_failures.multiqc.tsv"

title: "Variant Analysis - E6/E7 and Database Comparison"
module_order:
  - methods_summary
  - output_locations
  - reports_tables
  - variants_table
  - variant_effects_table
  - lineage_snp_comparison_table
  - database_snps_table
  - database_lineage_table
  - database_sample_table
  - samples_vs_database_table
  - samples_vs_database_sets_table
  - samples_vs_lineage_sets_table
  - hpv16_e6e7_summary_table
  - general_stats
  - bcftools
  - Samtools
report_section_order:
  general_stats:
    order: 9970
  Samtools:
    order: 9980
  samtools:
    order: 9980
  bcftools:
    order: 9990
rename_regex: true
sample_names_rename:
  - ["^3__",""]
  - ["^2__",""]
  - ["^1__",""]
section_order:
  - methods_summary
  - output_locations
  - reports_tables
  - variants_table
  - variant_effects_table
  - lineage_snp_comparison_table
  - database_snps_table
  - database_lineage_table
  - database_sample_table
  - samples_vs_database_table
  - samples_vs_database_sets_table
  - samples_vs_lineage_sets_table
  - hpv16_e6e7_summary_table

custom_data:
  methods_summary:
    plot_type: "html"
    section_name: "Methods summary"
    description: "Summary of variant analysis and database comparison steps"
    data: |
      <ul>
        <li><strong>Variant aggregation:</strong> summarize sample E6/E7 variants from mapping outputs.</li>
        <li><strong>Variant effects:</strong> translate variants to amino-acid changes and effects.</li>
        <li><strong>Lineage SNP comparison:</strong> annotate sample variants with HPV16/HPV18 lineage SNPs (optional).</li>
        <li><strong>Database comparison:</strong> extract database accessions, call SNPs against PAVE, and compare to sample and lineage SNPs.</li>
      </ul>
      <p><strong>References:</strong></p>
      <ul>
        <li>Li, 2011. A statistical framework for SNP calling, mutation discovery, association mapping and population genetical parameter estimation from sequencing data. <em>Bioinformatics</em>. DOI: 10.1093/bioinformatics/btr509.</li>
        <li>Li, 2018. Minimap2: pairwise alignment for nucleotide sequences. <em>Bioinformatics</em>. DOI: 10.1093/bioinformatics/bty191.</li>
      </ul>
  output_locations:
    plot_type: "html"
    section_name: "Output locations"
    description: "Default output paths (can be overridden with Nextflow params)"
    data: |
      <ul>
        <li><code>&lt;reports_dir&gt;/</code> for aggregate tables and this MultiQC report</li>
      </ul>
  reports_tables:
    plot_type: "html"
    section_name: "Reports tables"
    description: "Aggregate tables written to the reports directory"
    data: |
      <ul>
        <li><code>E6_E7_variants.tsv</code></li>
        <li><code>E6_E7_variant_effects.tsv</code></li>
        <li><code>lineage_snp_comparison.tsv</code></li>
        <li><code>database_snps.tsv</code></li>
        <li><code>database_lineage_comparison.tsv</code></li>
        <li><code>database_sample_comparison.tsv</code></li>
        <li><code>samples_vs_database.tsv</code></li>
        <li><code>samples_vs_database_sets.tsv</code></li>
        <li><code>samples_vs_lineage_sets.tsv</code></li>
        <li><code>hpv16_e6e7_variants_summary.tsv</code></li>
      </ul>
  variants_table:
    file_format: "tsv"
    section_name: "E6-E7 variants"
    description: "Aggregated variant calls"
    plot_type: "table"
    pconfig:
      col1_header: "Sample"
  variant_effects_table:
    file_format: "tsv"
    section_name: "E6-E7 variant effects"
    description: "Amino-acid consequences for E6-E7 variants"
    plot_type: "table"
    pconfig:
      col1_header: "Sample"
  lineage_snp_comparison_table:
    file_format: "tsv"
    section_name: "Lineage SNP comparison"
    description: "Sample E6/E7 SNPs annotated with lineage-defining SNPs"
    plot_type: "table"
    pconfig:
      col1_header: "Sample"
  database_snps_table:
    file_format: "tsv"
    section_name: "Database SNPs"
    description: "E6/E7 SNPs called from database reference genomes"
    plot_type: "table"
    pconfig:
      col1_header: "ID"
  database_lineage_table:
    file_format: "tsv"
    section_name: "Database vs lineages"
    description: "Database SNPs annotated with lineage-defining SNPs"
    plot_type: "table"
    pconfig:
      col1_header: "ID"
  database_sample_table:
    file_format: "tsv"
    section_name: "Database vs samples"
    description: "Database SNPs annotated with sample SNP matches"
    plot_type: "table"
    pconfig:
      col1_header: "ID"
  samples_vs_database_table:
    file_format: "tsv"
    section_name: "Samples vs database"
    description: "Sample SNPs annotated with database SNP matches"
    plot_type: "table"
    pconfig:
      col1_header: "ID"
  samples_vs_database_sets_table:
    file_format: "tsv"
    section_name: "Samples vs database (set)"
    description: "Sample SNP sets compared against database SNP sets"
    plot_type: "table"
    pconfig:
      col1_header: "ID"
  samples_vs_lineage_sets_table:
    file_format: "tsv"
    section_name: "Samples vs lineages (set)"
    description: "Sample SNP sets compared against lineage SNP sets"
    plot_type: "table"
    pconfig:
      col1_header: "ID"
  hpv16_e6e7_summary_table:
    file_format: "tsv"
    section_name: "HPV16 E6 and E7 variant summary"
    description: "Variant summaries for samples, database accessions, and lineages"
    plot_type: "table"
    pconfig:
      col1_header: "ID"


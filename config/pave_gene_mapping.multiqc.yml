report_title: "PAVE Gene Mapping - Report"

custom_content:
  methods_summary:
    order: 1
    name: "Methods summary"
    description: "Summary of mapping and depth reporting"
    html: |
      <ul>
        <li><strong>Bowtie2 mapping:</strong> map bucketed reads to the gene-specific PAVE reference.</li>
        <li><strong>Depth stats:</strong> compute depth profiles and per-feature statistics.</li>
        <li><strong>Aggregation:</strong> summarize strains and depth tables across samples.</li>
      </ul>
      <p><strong>References:</strong></p>
      <ul>
        <li>Langmead &amp; Salzberg, 2012. Fast gapped-read alignment with Bowtie 2. <em>Nature Methods</em>. DOI: 10.1038/nmeth.1923.</li>
        <li>Li et al., 2009. The Sequence Alignment/Map format and SAMtools. <em>Bioinformatics</em>. DOI: 10.1093/bioinformatics/btp352.</li>
      </ul>
  output_locations:
    order: 2
    name: "Output locations"
    description: "Default output paths (can be overridden with Nextflow params)"
    html: |
      <ul>
        <li><code>&lt;outdir&gt;/&lt;run_id&gt;/</code> for BAMs, depth files, and per-sample outputs</li>
        <li><code>&lt;reports_dir&gt;/</code> for aggregate tables and this MultiQC report</li>
        <li><code>&lt;index_dir&gt;/</code> for the Bowtie2 index</li>
      </ul>
  reports_tables:
    order: 3
    name: "Reports tables"
    description: "Aggregate tables written to the reports directory"
    html: |
      <ul>
        <li><code>strains.tsv</code></li>
        <li><code>depth_stats.unfiltered.tsv</code></li>
        <li><code>depth_stats.filtered.tsv</code></li>
      </ul>

custom_data:
  strains_table:
    file_format: "tsv"
    section_name: "Top strains"
    description: "Aggregated top strain calls"
    plot_type: "table"
    files:
      - "strains.tsv"
  depth_stats_table:
    file_format: "tsv"
    section_name: "Depth stats"
    description: "Aggregated depth statistics"
    plot_type: "table"
    files:
      - "depth_stats.unfiltered.tsv"
  depth_stats_filtered_table:
    file_format: "tsv"
    section_name: "Depth stats (filtered)"
    description: "Filtered depth statistics"
    plot_type: "table"
    files:
      - "depth_stats.filtered.tsv"

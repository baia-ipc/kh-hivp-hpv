title: "Centrifuge Bucketing - Step 001"

custom_data:
  methods_summary:
    plot_type: "html"
    section_name: "Methods summary"
    description: "Summary of processing steps for step 001"
    data: |
      <ul>
        <li><strong>Centrifuge alignment:</strong> classify reads and write <code>alignments/&lt;sample&gt;.aln.tsv</code> and <code>reports/&lt;sample&gt;.report.tsv</code>.</li>
        <li><strong>Kraken-style report:</strong> run <code>centrifuge-kreport</code> to create <code>kreports/&lt;sample&gt;.kreport.tsv</code>.</li>
        <li><strong>Krona plots:</strong> create interactive HTML summaries for all taxa and for non-human taxa.</li>
        <li><strong>LCA computation:</strong> compute the lowest common ancestor using <code>scripts/compute_lca.py</code>.</li>
        <li><strong>Bucket assignment:</strong> map reads to taxonomy buckets with <code>scripts/assign_to_buckets.py</code>.</li>
        <li><strong>Bucketized FASTQ:</strong> split reads into per-bucket FASTQs using <code>scripts/bucketize_fastq.py</code>.</li>
        <li><strong>Aggregation:</strong> generate aggregate count tables with <code>scripts/aggregate_bucket_counts.py</code>.</li>
      </ul>
      <p>
        Alignments are produced with Centrifuge against the configured HPV reference index.
        Reports and downstream summaries use the taxonomy dump specified in the pipeline config.
        Bucket assignment uses <code>metadata/bucket_taxonomy_ids.tsv</code> to map reads into taxonomy buckets.
        Human reads are excluded from the <em>wo_human</em> tables and plots using the configured taxonomy ID.
      </p>
      <p><strong>References:</strong></p>
      <ul>
        <li>Kim et al., 2016. Centrifuge: rapid and sensitive classification of metagenomic sequences. <em>Genome Research</em>. DOI: 10.1101/gr.210641.116.</li>
        <li>Ondov et al., 2011. Interactive metagenomic visualization in a Web browser (Krona). <em>BMC Bioinformatics</em>. DOI: 10.1186/1471-2105-12-385.</li>
      </ul>
  output_locations:
    plot_type: "html"
    section_name: "Output locations"
    description: "Default output paths (can be overridden with Nextflow params)"
    data: |
      <ul>
        <li><code>&lt;outdir&gt;/&lt;run_id&gt;/alignments/</code> and <code>reports/</code> for centrifuge outputs</li>
        <li><code>&lt;outdir&gt;/&lt;run_id&gt;/kreports/</code> for kraken-style reports</li>
        <li><code>&lt;outdir&gt;/&lt;run_id&gt;/krona/</code> and <code>krona_wo_human/</code> for Krona HTML</li>
        <li><code>&lt;outdir&gt;/&lt;run_id&gt;/lca/</code>, <code>bucket_assignments/</code>, <code>bucket_sizes/</code></li>
        <li><code>&lt;outdir&gt;/&lt;run_id&gt;/buckets/</code> for bucketized FASTQs and logs</li>
        <li><code>&lt;reports_dir&gt;/</code> for aggregate tables and this MultiQC report</li>
      </ul>
  reports_tables:
    plot_type: "html"
    section_name: "Reports tables"
    description: "Aggregate tables written to the reports directory"
    data: |
      <ul>
        <li><code>absolute_counts.tsv</code></li>
        <li><code>relative_counts.tsv</code></li>
        <li><code>relative_counts.wo_human.tsv</code></li>
      </ul>
  absolute_counts_table:
    file_format: "tsv"
    section_name: "Absolute counts"
    description: "Aggregate absolute counts per bucket across samples"
    plot_type: "table"
  relative_counts_table:
    file_format: "tsv"
    section_name: "Relative counts"
    description: "Aggregate relative counts per bucket across samples"
    plot_type: "table"
  relative_counts_wo_human_table:
    file_format: "tsv"
    section_name: "Relative counts (wo human)"
    description: "Aggregate relative counts with human bucket excluded"
    plot_type: "table"

sp:
  absolute_counts_table:
    fn: "absolute_counts.tsv"
  relative_counts_table:
    fn: "relative_counts.tsv"
  relative_counts_wo_human_table:
    fn: "relative_counts.wo_human.tsv"
